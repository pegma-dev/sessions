# Publishes the exact tarball prepared from a stable GitHub release tag.
# Authentication is npm trusted-publisher OIDC only; no token fallback exists.

name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      CI: "1"
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_ALLOWED_SIGNERS: ${{ vars.RELEASE_ALLOWED_SIGNERS }}
      REVIEWED_NPM_TARBALL: https://registry.npmjs.org/npm/-/npm-11.18.0.tgz
      REVIEWED_NPM_INTEGRITY: sha512-T67M4L5wNm0cZ7EBLErcEkY1SmzEW/WJ+SADBzsFUY1UdAPfFHXFQtZ6SEXiK0+vzXysCvAsepbMaBTwnrAD+w==

    steps:
      - name: Verify the release source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RELEASE_PRERELEASE}" != "false" ]]; then
            echo "::error::Only stable releases are supported"
            exit 1
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^v(0\.[1-9][0-9]*|[1-9][0-9]*\.[0-9]+)\.[0-9]+$ ]] ||
            [[ ! "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] ||
            [[ "${RELEASE_TAG}" == "v0.1.0" ]]; then
            echo "::error::Release tag must be a supported stable version"
            exit 1
          fi
          if [[ ! "${RELEASE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Release commit must be an exact commit ID"
            exit 1
          fi
          if [[ -z "${RELEASE_ALLOWED_SIGNERS}" ]]; then
            echo "::error::RELEASE_ALLOWED_SIGNERS must contain the reviewed SSH allowed-signers entries"
            exit 1
          fi

          allowed_signers="${RUNNER_TEMP}/release-allowed-signers"
          umask 077
          : > "${allowed_signers}"
          chmod 0600 "${allowed_signers}"
          printf '%s\n' "${RELEASE_ALLOWED_SIGNERS}" > "${allowed_signers}"

          scratch="$(mktemp -d "${RUNNER_TEMP}/release-verify.XXXXXX")"
          trap 'rm -rf -- "${scratch}"' EXIT
          repository="${scratch}/repository.git"
          git init --quiet --bare "${repository}"
          git -C "${repository}" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "${repository}" config gpg.format ssh
          git -C "${repository}" config gpg.ssh.allowedSignersFile "${allowed_signers}"
          git -C "${repository}" fetch --quiet --no-tags origin \
            refs/heads/main:refs/remotes/origin/main \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

          tag_ref="refs/tags/${RELEASE_TAG}"
          if [[ "$(git -C "${repository}" cat-file -t "${tag_ref}")" != "tag" ]]; then
            echo "::error::Release ref must be an annotated tag"
            exit 1
          fi
          if ! git -C "${repository}" verify-tag "${tag_ref}"; then
            echo "::error::Release tag signature is not approved"
            exit 1
          fi
          if ! tag_commit="$(git -C "${repository}" rev-parse --verify "${tag_ref}^{commit}")"; then
            echo "::error::Release tag commit could not be resolved"
            exit 1
          fi
          if [[ "${tag_commit}" != "${RELEASE_COMMIT}" ]]; then
            echo "::error::Release tag does not match the event commit"
            exit 1
          fi
          if ! git -C "${repository}" merge-base --is-ancestor \
            "${RELEASE_COMMIT}" refs/remotes/origin/main; then
            echo "::error::Release commit is not contained in origin/main"
            exit 1
          fi

      - name: Check out the verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch verified release refs
        shell: bash
        run: |
          set -euo pipefail
          allowed_signers="${RUNNER_TEMP}/release-allowed-signers"
          git config --local gpg.format ssh
          git config --local gpg.ssh.allowedSignersFile "${allowed_signers}"
          git fetch --quiet --no-tags origin \
            refs/heads/main:refs/remotes/origin/main \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Use the reviewed npm release
        shell: bash
        run: |
          set -euo pipefail
          npm_directory="$(mktemp -d "${RUNNER_TEMP}/reviewed-npm.XXXXXX")"
          trap 'rm -rf -- "${npm_directory}"' EXIT
          npm_tarball="${npm_directory}/npm-11.18.0.tgz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${npm_tarball}" "${REVIEWED_NPM_TARBALL}"
          node --input-type=module - "${npm_tarball}" <<'NODE'
          import { createHash, timingSafeEqual } from "node:crypto";
          import { readFileSync } from "node:fs";

          const actual = `sha512-${createHash("sha512")
            .update(readFileSync(process.argv[2]))
            .digest("base64")}`;
          const expected = process.env.REVIEWED_NPM_INTEGRITY;
          const actualBytes = Buffer.from(actual);
          const expectedBytes = Buffer.from(expected);
          if (
            actualBytes.length !== expectedBytes.length ||
            !timingSafeEqual(actualBytes, expectedBytes)
          ) {
            throw new Error("reviewed npm integrity does not match");
          }
          NODE
          npm install --global "${npm_tarball}" --ignore-scripts
          if [[ "$(npm --version)" != "11.18.0" ]]; then
            echo "::error::Reviewed npm version is not active"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release metadata
        run: pnpm run release:check

      - name: Check formatting
        run: pnpm run format:check

      - name: Check types
        run: pnpm run check

      - name: Run tests
        run: pnpm test

      - name: Remove generated package outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- packages/sessions/dist
          find . -path './node_modules' -prune -o \
            -type f -name '*.tsbuildinfo' -delete

      - name: Prepare and verify the release tarball
        run: pnpm run release:pack -- -- --require-clean --require-main-ancestor --require-release-tag --expected-release-commit "${RELEASE_COMMIT}" --output .release

      - name: Check the prepared file inventory
        id: inventory
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {
            copyFileSync,
            lstatSync,
            mkdirSync,
            readdirSync,
          } from "node:fs";
          import { join } from "node:path";

          const version = process.env.RELEASE_TAG.slice(1);
          const tarball = `pegma-sessions-${version}.tgz`;
          const expected = ["package-manifest.json", tarball].sort();
          const directory = ".release";
          const entries = readdirSync(directory, { withFileTypes: true });
          const names = entries.map(({ name }) => name).sort();
          if (
            names.length !== expected.length ||
            names.some((name, index) => name !== expected[index])
          ) {
            throw new Error("prepared file inventory is not exact");
          }
          for (const name of expected) {
            const entry = entries.find((candidate) => candidate.name === name);
            if (entry?.isFile() !== true || !lstatSync(join(directory, name)).isFile()) {
              throw new Error("prepared entries must be regular files");
            }
          }
          const uploadDirectory = "release-upload";
          mkdirSync(uploadDirectory);
          for (const name of expected) {
            copyFileSync(join(directory, name), join(uploadDirectory, name));
          }
          const uploadEntries = readdirSync(uploadDirectory, {
            withFileTypes: true,
          });
          const uploadNames = uploadEntries.map(({ name }) => name).sort();
          if (
            uploadNames.length !== expected.length ||
            uploadNames.some((name, index) => name !== expected[index]) ||
            uploadEntries.some((entry) => !entry.isFile())
          ) {
            throw new Error("upload file inventory is not exact");
          }
          NODE
          node --input-type=module >> "${GITHUB_OUTPUT}" <<'NODE'
          const version = process.env.RELEASE_TAG.slice(1);
          process.stdout.write(`tarball=release-upload/pegma-sessions-${version}.tgz\n`);
          NODE

      - name: Upload the prepared release
        id: upload
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: sessions-release-${{ github.run_id }}
          path: |
            release-upload/package-manifest.json
            ${{ steps.inventory.outputs.tarball }}
          if-no-files-found: error
          include-hidden-files: false
          overwrite: true
          retention-days: 30

      - name: Record the prepared artifact digest
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: echo "Prepared artifact SHA-256 ${ARTIFACT_DIGEST}" >> "${GITHUB_STEP_SUMMARY}"

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      CI: "1"
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_ALLOWED_SIGNERS: ${{ vars.RELEASE_ALLOWED_SIGNERS }}
      RELEASE_DIRECTORY: ${{ runner.temp }}/sessions-release/.release
      REVIEWED_NPM_TARBALL: https://registry.npmjs.org/npm/-/npm-11.18.0.tgz
      REVIEWED_NPM_INTEGRITY: sha512-T67M4L5wNm0cZ7EBLErcEkY1SmzEW/WJ+SADBzsFUY1UdAPfFHXFQtZ6SEXiK0+vzXysCvAsepbMaBTwnrAD+w==

    steps:
      - name: Verify the release source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RELEASE_PRERELEASE}" != "false" ]]; then
            echo "::error::Only stable releases are supported"
            exit 1
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^v(0\.[1-9][0-9]*|[1-9][0-9]*\.[0-9]+)\.[0-9]+$ ]] ||
            [[ ! "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] ||
            [[ "${RELEASE_TAG}" == "v0.1.0" ]]; then
            echo "::error::Release tag must be a supported stable version"
            exit 1
          fi
          if [[ ! "${RELEASE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Release commit must be an exact commit ID"
            exit 1
          fi
          if [[ -z "${RELEASE_ALLOWED_SIGNERS}" ]]; then
            echo "::error::RELEASE_ALLOWED_SIGNERS must contain the reviewed SSH allowed-signers entries"
            exit 1
          fi

          allowed_signers="${RUNNER_TEMP}/release-allowed-signers"
          umask 077
          : > "${allowed_signers}"
          chmod 0600 "${allowed_signers}"
          printf '%s\n' "${RELEASE_ALLOWED_SIGNERS}" > "${allowed_signers}"

          scratch="$(mktemp -d "${RUNNER_TEMP}/release-verify.XXXXXX")"
          trap 'rm -rf -- "${scratch}"' EXIT
          repository="${scratch}/repository.git"
          git init --quiet --bare "${repository}"
          git -C "${repository}" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "${repository}" config gpg.format ssh
          git -C "${repository}" config gpg.ssh.allowedSignersFile "${allowed_signers}"
          git -C "${repository}" fetch --quiet --no-tags origin \
            refs/heads/main:refs/remotes/origin/main \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

          tag_ref="refs/tags/${RELEASE_TAG}"
          if [[ "$(git -C "${repository}" cat-file -t "${tag_ref}")" != "tag" ]]; then
            echo "::error::Release ref must be an annotated tag"
            exit 1
          fi
          if ! git -C "${repository}" verify-tag "${tag_ref}"; then
            echo "::error::Release tag signature is not approved"
            exit 1
          fi
          if ! tag_commit="$(git -C "${repository}" rev-parse --verify "${tag_ref}^{commit}")"; then
            echo "::error::Release tag commit could not be resolved"
            exit 1
          fi
          if [[ "${tag_commit}" != "${RELEASE_COMMIT}" ]]; then
            echo "::error::Release tag does not match the event commit"
            exit 1
          fi
          if ! git -C "${repository}" merge-base --is-ancestor \
            "${RELEASE_COMMIT}" refs/remotes/origin/main; then
            echo "::error::Release commit is not contained in origin/main"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Use the reviewed npm release
        shell: bash
        run: |
          set -euo pipefail
          npm_directory="$(mktemp -d "${RUNNER_TEMP}/reviewed-npm.XXXXXX")"
          trap 'rm -rf -- "${npm_directory}"' EXIT
          npm_tarball="${npm_directory}/npm-11.18.0.tgz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${npm_tarball}" "${REVIEWED_NPM_TARBALL}"
          node --input-type=module - "${npm_tarball}" <<'NODE'
          import { createHash, timingSafeEqual } from "node:crypto";
          import { readFileSync } from "node:fs";

          const actual = `sha512-${createHash("sha512")
            .update(readFileSync(process.argv[2]))
            .digest("base64")}`;
          const expected = process.env.REVIEWED_NPM_INTEGRITY;
          const actualBytes = Buffer.from(actual);
          const expectedBytes = Buffer.from(expected);
          if (
            actualBytes.length !== expectedBytes.length ||
            !timingSafeEqual(actualBytes, expectedBytes)
          ) {
            throw new Error("reviewed npm integrity does not match");
          }
          NODE
          npm install --global "${npm_tarball}" --ignore-scripts
          if [[ "$(npm --version)" != "11.18.0" ]]; then
            echo "::error::Reviewed npm version is not active"
            exit 1
          fi

      - name: Download the prepared release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sessions-release-${{ github.run_id }}
          path: ${{ env.RELEASE_DIRECTORY }}

      - name: Publish the prepared tarball
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { spawnSync } from "node:child_process";
          import { createHash, timingSafeEqual } from "node:crypto";
          import {
            chmodSync,
            existsSync,
            lstatSync,
            mkdirSync,
            mkdtempSync,
            readFileSync,
            readdirSync,
            realpathSync,
            rmSync,
            writeFileSync,
          } from "node:fs";
          import { tmpdir } from "node:os";
          import { basename, dirname, join, resolve } from "node:path";

          const PACKAGE_NAME = "@pegma/sessions";
          const REGISTRY = "https://registry.npmjs.org/";
          const directory = resolve(process.env.RELEASE_DIRECTORY);
          const version = process.env.RELEASE_TAG.slice(1);
          const expectedTarball = `pegma-sessions-${version}.tgz`;
          const expectedNames = ["package-manifest.json", expectedTarball].sort();
          const entries = readdirSync(directory, { withFileTypes: true });
          const names = entries.map(({ name }) => name).sort();
          if (
            names.length !== expectedNames.length ||
            names.some((name, index) => name !== expectedNames[index])
          ) {
            throw new Error("prepared file inventory is not exact");
          }
          for (const name of expectedNames) {
            const entry = entries.find((candidate) => candidate.name === name);
            if (entry?.isFile() !== true || !lstatSync(join(directory, name)).isFile()) {
              throw new Error("prepared entries must be regular files");
            }
          }

          const hasExactKeys = (value, expected) => {
            if (value === null || typeof value !== "object" || Array.isArray(value)) {
              return false;
            }
            const actual = Object.keys(value).sort();
            const keys = [...expected].sort();
            return actual.length === keys.length && actual.every((key, index) => key === keys[index]);
          };
          const manifestPath = join(directory, "package-manifest.json");
          const prepared = JSON.parse(readFileSync(manifestPath, "utf8"));
          const record = prepared.package;
          if (
            !hasExactKeys(prepared, ["gitCommit", "package", "releaseTag", "schemaVersion", "version"]) ||
            !hasExactKeys(record, ["files", "integrity", "name", "sha256", "shasum", "tarball", "version"]) ||
            prepared.schemaVersion !== 1 ||
            prepared.version !== version ||
            prepared.releaseTag !== process.env.RELEASE_TAG ||
            prepared.gitCommit !== process.env.RELEASE_COMMIT ||
            record.name !== PACKAGE_NAME ||
            record.version !== version ||
            record.tarball !== expectedTarball ||
            !/^[0-9a-f]{64}$/u.test(record.sha256) ||
            !/^sha512-[A-Za-z0-9+/]{86}==$/u.test(record.integrity) ||
            !/^[0-9a-f]{40}$/u.test(record.shasum) ||
            !Array.isArray(record.files) ||
            record.files.some((file) =>
              !hasExactKeys(file, ["path", "size"]) ||
              typeof file.path !== "string" ||
              file.path.length === 0 ||
              !Number.isSafeInteger(file.size) ||
              file.size < 0,
            )
          ) {
            throw new Error("prepared package manifest is invalid");
          }
          const packedPaths = record.files.map(({ path }) => path);
          for (const required of [
            "package.json",
            "README.md",
            "LICENSE",
            "dist/index.d.ts",
            "dist/index.js",
          ]) {
            if (!packedPaths.includes(required)) {
              throw new Error(`package is missing ${required}`);
            }
          }
          if (packedPaths.some((path) =>
            !["package.json", "README.md", "LICENSE"].includes(path) && !path.startsWith("dist/"),
          )) {
            throw new Error("package file inventory is not expected");
          }

          const tarballPath = join(directory, expectedTarball);
          if (basename(tarballPath) !== expectedTarball || dirname(tarballPath) !== directory) {
            throw new Error("prepared tarball path is invalid");
          }
          const bytes = readFileSync(tarballPath);
          const sha256 = createHash("sha256").update(bytes).digest("hex");
          const integrity = `sha512-${createHash("sha512").update(bytes).digest("base64")}`;
          const shasum = createHash("sha1").update(bytes).digest("hex");
          const equal = (left, right) => {
            const leftBytes = Buffer.from(left);
            const rightBytes = Buffer.from(right);
            return leftBytes.length === rightBytes.length && timingSafeEqual(leftBytes, rightBytes);
          };
          if (!equal(sha256, record.sha256) || !equal(integrity, record.integrity) || !equal(shasum, record.shasum)) {
            throw new Error("prepared tarball digests do not match");
          }

          const executableDirectory = dirname(process.execPath);
          const npmCandidates = [
            join(executableDirectory, "node_modules", "npm", "bin", "npm-cli.js"),
            resolve(executableDirectory, "..", "lib", "node_modules", "npm", "bin", "npm-cli.js"),
          ];
          const npmCliCandidate = npmCandidates.find(existsSync);
          if (npmCliCandidate === undefined) {
            throw new Error("npm CLI was not found beside Node.js");
          }
          const npmCli = realpathSync(npmCliCandidate);
          const runtimeRoot = mkdtempSync(join(tmpdir(), "sessions-publish-"));
          const cwd = join(runtimeRoot, "cwd");
          const userConfig = join(runtimeRoot, "user.npmrc");
          const globalConfig = join(runtimeRoot, "global.npmrc");
          mkdirSync(cwd, { mode: 0o700 });
          writeFileSync(userConfig, "", { mode: 0o600 });
          writeFileSync(globalConfig, "", { mode: 0o600 });
          chmodSync(userConfig, 0o600);
          chmodSync(globalConfig, 0o600);

          const allowedNames = new Set([
            "ACTIONS_ID_TOKEN_REQUEST_TOKEN",
            "ACTIONS_ID_TOKEN_REQUEST_URL",
            "CI",
            "COMSPEC",
            "HOME",
            "HOMEDRIVE",
            "HOMEPATH",
            "LOCALAPPDATA",
            "PATH",
            "Path",
            "PATHEXT",
            "SystemRoot",
            "SYSTEMROOT",
            "TEMP",
            "TMP",
            "TMPDIR",
            "USERPROFILE",
            "WINDIR",
          ]);
          const env = {};
          for (const [name, value] of Object.entries(process.env)) {
            if (value !== undefined && (allowedNames.has(name) || name.startsWith("GITHUB_"))) {
              env[name] = value;
            }
          }
          env.NPM_CONFIG_USERCONFIG = userConfig;
          env.NPM_CONFIG_GLOBALCONFIG = globalConfig;

          const npm = (arguments_, allowFailure = false) => {
            const result = spawnSync(process.execPath, [npmCli, ...arguments_], {
              cwd,
              env,
              encoding: "utf8",
              stdio: "pipe",
            });
            if (result.error) throw result.error;
            if (result.status !== 0 && !allowFailure) {
              throw new Error(`npm failed with exit code ${String(result.status)}:\n${result.stdout}\n${result.stderr}`);
            }
            return result;
          };
          const queryRegistryIntegrity = (spec) => {
            const lookup = npm([
              "view",
              spec,
              "dist.integrity",
              "--json",
              "--registry",
              REGISTRY,
            ], true);
            if (lookup.status === 0) {
              const value = JSON.parse(lookup.stdout);
              if (typeof value !== "string" || value.length === 0) {
                throw new Error("registry version has no package integrity");
              }
              return value;
            }
            const output = `${lookup.stdout}\n${lookup.stderr}`;
            if (/\bE404\b/u.test(output)) return null;
            throw new Error(`npm registry lookup failed:\n${output.trim()}`);
          };
          const wait = (milliseconds) => {
            Atomics.wait(
              new Int32Array(new SharedArrayBuffer(4)),
              0,
              0,
              milliseconds,
            );
          };

          try {
            const npmVersion = npm(["--version"]).stdout.trim();
            if (npmVersion !== "11.18.0") {
              throw new Error(`unexpected npm version ${npmVersion}`);
            }
            const spec = `${PACKAGE_NAME}@${version}`;
            const publishedIntegrity = queryRegistryIntegrity(spec);
            if (publishedIntegrity !== null) {
              if (!equal(record.integrity, publishedIntegrity)) {
                throw new Error("registry version has different package integrity");
              }
              process.stdout.write(`Verified existing ${spec}; skipping.\n`);
            } else {
              npm([
                "publish",
                tarballPath,
                "--access",
                "public",
                "--registry",
                REGISTRY,
                "--provenance",
                "--ignore-scripts",
              ]);
              let confirmed = false;
              for (let attempt = 0; attempt < 6; attempt += 1) {
                const currentIntegrity = queryRegistryIntegrity(spec);
                if (
                  currentIntegrity !== null &&
                  equal(record.integrity, currentIntegrity)
                ) {
                  confirmed = true;
                  break;
                }
                if (attempt < 5) wait(2 ** attempt * 1000);
              }
              if (!confirmed) {
                throw new Error(
                  `${spec} did not expose the prepared package integrity`,
                );
              }
            }
          } finally {
            rmSync(runtimeRoot, { recursive: true, force: true });
          }
          NODE
